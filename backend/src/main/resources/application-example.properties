# Healix HealthOS — Example Application Configuration
# Copy this file or set the required environment variables in your environment/IDE.

# ==============================================================================
# Environment Variables:
# ------------------------------------------------------------------------------
# DB_PASSWORD: The password for your local or remote MySQL instance (required)
#   Example (PowerShell): $env:DB_PASSWORD="your_password_here"
#   Example (Bash):       export DB_PASSWORD="your_password_here"
#
# JWT_SECRET: 256-bit secret key for signing JWTs (optional in dev, required in prod)
#   Example (PowerShell): $env:JWT_SECRET="your-secure-random-256-bit-key-value-12345"
#   Example (Bash):       export JWT_SECRET="your-secure-random-256-bit-key-value-12345"
# ==============================================================================

spring.application.name=HealixHealthOS

# ---- MySQL Database ----
spring.datasource.url=jdbc:mysql://localhost:3306/healix_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- Server ----
server.port=8080

# ---- JWT ----
# 256-bit+ secret required for HS256; change this for real deployments.
app.jwt.secret=${JWT_SECRET:dev-only-change-me-super-secret-key-1234567890}
app.jwt.expiration-ms=86400000

# ---- CORS (React dev server) ----
app.cors.allowed-origin=http://localhost:3000
